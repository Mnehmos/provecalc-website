name: Website CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: provecalc-website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next:
    name: Next.js build and route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The containment smoke renders the public Clerk provider but never
      # authenticates. Keep the fixture non-secret and separate from any
      # deployment credentials so CI can build without enabling providers.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuaW5zcGlyZWQucHVtYS03NC5sY2wuZGV2JA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke default-off production routes
        run: npm run test:routes

  python:
    name: Python sidecar checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          python-version: '3.11.8'
          activate-environment: true
          no-project: true
          enable-cache: true
          cache-python: true

      - name: Install exact sidecar dependencies
        run: uv pip install --require-hashes -r api-sidecar/requirements-dev.txt

      - name: Check dependency consistency
        run: uv pip check

      - name: Run Ruff
        working-directory: api-sidecar
        run: python -m ruff check src tests

      - name: Run Mypy
        working-directory: api-sidecar
        run: python -m mypy src --explicit-package-bases --ignore-missing-imports

      - name: Run Python tests
        working-directory: api-sidecar
        run: python -m pytest -q

      - name: Build production sidecar container
        run: docker build --file api-sidecar/Dockerfile api-sidecar
